name: rebuild publish

# Publishes the rolling pre-release tagged "rebuild" on every push to the rebuild branch: install.sh, the two
# binaries and checksums.txt. The tag and the pre-release are the only releases this workflow touches; it never
# marks anything Latest, never touches main, and never creates any other tag. The tag is deleted at the first real
# release, which is the user's call.

on:
  push:
    branches: [rebuild]

permissions:
  contents: read

concurrency:
  group: rebuild-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build syp for amd64 and arm64
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          ver="rebuild-${GITHUB_SHA::7}"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-X main.version=$ver" -o "syp-linux-$arch" ./cmd/syp
          done
          cp deploy/install.sh install.sh
          sha256sum syp-linux-amd64 syp-linux-arm64 install.sh > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: syp-rebuild
          path: |
            install.sh
            syp-linux-amd64
            syp-linux-arm64
            checksums.txt
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: syp-rebuild

      - name: Move the rebuild tag and update the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          repo="$GITHUB_REPOSITORY"
          # The tag follows the branch: it moves to this commit on every push.
          git tag -f rebuild "$GITHUB_SHA"
          git push -f origin refs/tags/rebuild
          if ! gh release view rebuild --repo "$repo" >/dev/null 2>&1; then
            gh release create rebuild --repo "$repo" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "rebuild (rolling pre-release)" \
              --notes "Rolling pre-release from the rebuild branch. Replaced on every push to rebuild. Not a release."
          else
            gh release edit rebuild --repo "$repo" --prerelease --latest=false
          fi
          gh release upload rebuild --repo "$repo" --clobber install.sh syp-linux-amd64 syp-linux-arm64 checksums.txt
