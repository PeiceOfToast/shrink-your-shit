name: Publish image

# Pushing a version tag like v0.1.0 (vN.N.N, optionally with a -rc1 suffix) builds a linux/amd64 + linux/arm64 image and publishes it to
# ghcr.io/<owner>/<repo> as 0.1.0 and latest (pre-releases like v0.1.0-rc1 get no latest). Running it by hand on a branch only builds and
# smoke-tests (nothing is pushed); running it by hand, even on a tag, never publishes: only a pushed tag does.
# A pull request that touches the image files also only builds and smoke-tests.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
  # A pull request that changes the image builds and smoke-tests it (nothing is pushed), so a change to the
  # entrypoint or Dockerfile can't break the release unnoticed (v0.1.0's smoke test failed only at the tag).
  pull_request:
    paths: [Dockerfile, docker-entrypoint.sh, run-as-syp.sh, .dockerignore, .github/workflows/release-image.yml]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # "latest" is added automatically for stable versions (v0.1.0), not for pre-releases (v0.1.0-rc1)
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build amd64 image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: syp-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (web page answers, app runs as uid 1000)
        run: |
          docker run -d --name syp -p 8484:8484 -v "$RUNNER_TEMP":/media syp-smoke
          ok=
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8484/healthz && { ok=1; break; }; sleep 1; done
          if [ -z "$ok" ]; then docker logs syp; exit 1; fi
          # The container starts as root (the entrypoint may start the share helper) and then execs the app as syp,
          # so the app is PID 1: it must be the app, running as uid 1000 (real, effective, saved and filesystem uid).
          exe=$(docker exec syp readlink /proc/1/exe)
          uids=$(docker exec syp grep '^Uid:' /proc/1/status)
          echo "PID 1: $exe, $uids"
          test "$exe" = /usr/local/lib/shrink-your-shit/shrink-your-shit
          test "$(echo $uids)" = "Uid: 1000 1000 1000 1000"
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
