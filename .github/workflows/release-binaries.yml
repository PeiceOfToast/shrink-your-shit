name: Release binaries

# Pushing a version tag like v0.1.0 builds the program for Linux, macOS and Windows and attaches
# the archives and checksums.txt to a GitHub Release (pre-release tags like v0.1.0-rc1 are marked
# as pre-releases). Running it by hand (even on a tag) only builds and uploads the files as a
# workflow artifact; only a pushed tag creates a release.
# Independent of release-image.yml (the container image), which uses the same tags.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test before releasing
        run: go vet ./... && go test -count=1 ./...
      - name: Build archives
        env:
          # via env, never pasted into the script text: a tag name can contain shell characters
          VER: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0-dev.{0}', github.run_number) }}
        run: sh scripts/build-release.sh "$VER"
      - name: Check the linux/amd64 binary reports its version
        run: |
          tar -xzf dist/shrink-your-shit_linux_amd64.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shrink-your-shit_linux_amd64/shrink-your-shit" -version
      - name: Attach to the GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in *-*) pre=--prerelease ;; *) pre= ;; esac
          # shellcheck disable=SC2086
          gh release create "$TAG" dist/* --title "$TAG" --generate-notes $pre
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: release-files
          path: dist/*

  windows-installer:
    # Needs the release to exist (created by the job above), so it runs after it.
    needs: binaries
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Inno Setup if the runner lacks it
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build the installer
        env:
          VER: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0-dev.{0}', github.run_number) }}
        run: pwsh installer/windows/build.ps1 -Version ($env:VER -replace '^v', '')
      - name: Silent install, real conversion, upgrade, uninstall
        run: pwsh installer/windows/smoke-test.ps1 -Setup dist/shrink-your-shit-setup.exe
      - name: Attach to the GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload $env:TAG dist/shrink-your-shit-setup.exe
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: windows-installer
          path: dist/shrink-your-shit-setup.exe
