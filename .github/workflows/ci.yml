name: CI

on:
  pull_request:
    branches: [rebuild]
  push:
    branches: [rebuild]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: ui
        run: npx tsc -b

      - name: Test
        working-directory: ui
        run: npm test

      - name: Build
        working-directory: ui
        run: npm run build

      - name: Contract
        working-directory: ui
        run: npm run contract

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The web interface is embedded in the binary (internal/ui), so build it before the Go
      # steps: the tests then run against the real dist, not the committed placeholder page. A
      # build wipes internal/ui/dist and writes new hashed assets; nothing here is committed.
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the web interface
        working-directory: ui
        run: npm ci --no-audit --no-fund && npm run build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Format
        run: test -z "$(gofmt -l .)"

      # Real ffmpeg, pinned by name and sha256 so the runner image cannot move it (L-INST-7).
      # BtbN's static build n8.0.1, the same source the installer's later pin may reuse.
      # The cache is keyed on the checksum: a cached copy skips the download, and a BtbN prune
      # breaks CI only once the cache has expired.
      - name: Cache ffmpeg 8
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-8
          key: ffmpeg-cab6b5dd9cede8a8db8891e28f2fec2ddfd6401785328d139cbcfd23af9f691e

      - name: Install ffmpeg 8
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ff.tar.xz" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2025-11-30-12-53/ffmpeg-n8.0.1-17-g27a297f186-linux64-gpl-8.0.tar.xz"
          echo "cab6b5dd9cede8a8db8891e28f2fec2ddfd6401785328d139cbcfd23af9f691e  $RUNNER_TEMP/ff.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ffmpeg-8"
          tar -xf "$RUNNER_TEMP/ff.tar.xz" -C "$RUNNER_TEMP/ffmpeg-8"

      - name: Put ffmpeg 8 on PATH
        run: echo "$RUNNER_TEMP/ffmpeg-8/ffmpeg-n8.0.1-17-g27a297f186-linux64-gpl-8.0/bin" >> "$GITHUB_PATH"

      # Every real test must run, not skip: SYP_REQUIRE_FFMPEG turns a missing tool into a
      # failure, and the grep turns any "--- SKIP: TestReal" into one too.
      - name: Test real (ffmpeg 8)
        env:
          SYP_REQUIRE_FFMPEG: "1"
        run: |
          ffmpeg -version | head -n 1
          go test -count=1 -v -run TestReal ./... > real.log 2>&1 || { cat real.log; exit 1; }
          grep -E '^[[:space:]]*--- (PASS|FAIL|SKIP): TestReal' real.log
          grep -qE '^[[:space:]]*--- PASS: TestReal' real.log || { echo "no real test ran"; exit 1; }
          if grep -qE '^[[:space:]]*--- SKIP: TestReal' real.log; then echo "a real test was skipped"; exit 1; fi

  # The real path in a real browser: the built interface against a server on a temp data folder, the way
  # pages 01-03 are walked after a fresh install (contract section 6). Runs ui/e2e/real.spec.ts through the
  # interface's own script (npm run e2e:real), both tests in one run on fresh data.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The same pinned ffmpeg 8 as the go job, so a clip this job makes is one a real install can read.
      - name: Cache ffmpeg 8
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-8
          key: ffmpeg-cab6b5dd9cede8a8db8891e28f2fec2ddfd6401785328d139cbcfd23af9f691e

      - name: Install ffmpeg 8
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ff.tar.xz" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2025-11-30-12-53/ffmpeg-n8.0.1-17-g27a297f186-linux64-gpl-8.0.tar.xz"
          echo "cab6b5dd9cede8a8db8891e28f2fec2ddfd6401785328d139cbcfd23af9f691e  $RUNNER_TEMP/ff.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ffmpeg-8"
          tar -xf "$RUNNER_TEMP/ff.tar.xz" -C "$RUNNER_TEMP/ffmpeg-8"

      - name: Put ffmpeg 8 on PATH
        run: echo "$RUNNER_TEMP/ffmpeg-8/ffmpeg-n8.0.1-17-g27a297f186-linux64-gpl-8.0/bin" >> "$GITHUB_PATH"

      # The interface first: the Go build embeds internal/ui/dist, and a binary built without it serves
      # the "not built" page.
      - name: Build the interface and syp
        run: |
          (cd ui && npm ci --no-audit --no-fund && npm run build)
          go build -o "$RUNNER_TEMP/syp" ./cmd/syp

      - name: Make the library's three clips
        run: |
          mkdir -p "$RUNNER_TEMP/clips" "$RUNNER_TEMP/data"
          for i in 1 2 3; do
            ffmpeg -v error -f lavfi -i testsrc2=size=1280x720:rate=30 -t 3 \
              -c:v libx264 -preset veryfast -crf 6 -pix_fmt yuv420p "$RUNNER_TEMP/clips/clip$i.mp4"
          done

      - name: Start syp
        run: |
          "$RUNNER_TEMP/syp" -data "$RUNNER_TEMP/data" -listen 127.0.0.1:18484 \
            -ffmpeg "$(dirname "$(command -v ffmpeg)")" &
          echo $! > "$RUNNER_TEMP/syp.pid"
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:18484/api/v2/health; then exit 0; fi
            sleep 1
          done
          echo "syp did not answer health" >&2
          exit 1

      # ui's npm ci ran in the build step above; this adds the browser revision @playwright/test expects.
      - name: Playwright
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Run the real path
        working-directory: ui
        env:
          BASE_URL: http://127.0.0.1:18484
          E2E_LIBRARY: ${{ runner.temp }}/clips
          E2E_PASSWORD: e2e-password-1
          E2E_CONVERT: "1"
        run: npm run e2e:real -- --trace retain-on-failure

      # The pid this job started, never a pattern: someone else's syp can be on the runner.
      - name: Stop syp
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/syp.pid")" 2>/dev/null || true

      - name: Keep the trace of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-trace
          path: ui/test-results
          if-no-files-found: ignore

  go-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Lint the deploy scripts
        run: shellcheck deploy/*.sh deploy/test/*.sh
