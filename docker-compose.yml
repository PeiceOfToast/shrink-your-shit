# Example: copy this file, change the media path, then run `docker compose up -d`.
# WARNING: shrink-your-shit REPLACES original files. Start with a copy of your media.
services:
  shrink-your-shit:
    build: .
    # Once a release has been published (and the package made public, see docs/proxmox.md) you
    # can pull instead of building: comment out "build: ." above and use
    # image: ghcr.io/peiceoftoast/shrink-your-shit:latest
    # user: "1000:1000"    # must be able to read AND write the media folder; change to match its owner
    ports:
      - "8484:8484"        # needs the access token (docker exec <name> shrink-your-shit token); no HTTPS, so never expose it to the internet
    volumes:
      - syp-config:/config              # database (a named volume, so it is writable by the program)
                                        # it also holds the key to saved share passwords: keep backups of it private
      - /path/to/COPY-of-your-videos:/media
    # Lets the app mount NFS/SMB shares added on the Shares page. It gives the container mount rights (close to privileged);
    # if you don't use network shares, or mount them on the host, delete cap_add and security_opt.
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - "apparmor:unconfined"
    # environment:
    #   SYP_LIBRARIES: /media:/media2   # several folders, separated by ":"
    # command: ["-min-bitrate", "3000", "-crf", "24"]   # extra settings, same flags as the program
    # Intel GPU (Quick Sync). Uncomment both, then set the group id of "render" on the host:
    #   getent group render | cut -d: -f3
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "<render group id>"
    restart: unless-stopped

volumes:
  syp-config:
